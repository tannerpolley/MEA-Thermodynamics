id: equilibrium_package_replay
title: Public ePC-SAFT Equilibrium replay of the MEA model comparison
status: nonpromoting_capability_audit
manuscript_integration: excluded
inputs:
  - data/reference/MEA/manifests/chemical_reaction_source_contract.json
  - data/reference/MEA/manifests/homogeneous_speciation_sentinel_contract.json
  - data/reference/epcsaft_bundles/mea-co2-h2o-nine-species-regression-input/1
