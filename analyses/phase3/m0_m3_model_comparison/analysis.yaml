claim_boundary: The results are diagnostic model comparisons. M3 is a two-row fit, M4A is a single-source pressure fit, M4B is a joint-source pressure fit, M5Q uses a QQ-consistent CO2 set, and M5 activates full neutral DD/QQ/DQ without refitting H2O or MEA; none permits parameter promotion or a predictive claim.
